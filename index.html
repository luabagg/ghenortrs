<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GHENO | Componentes MTB de Alto Desempenho</title>
    <!-- Font preconnect: eliminates render-blocking @import in CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Sora:wght@650;700&display=swap"
    />
    <!-- Preload LCP hero image so it starts fetching before CSS/JS parse -->
    <link
      rel="preload"
      href="/reference-images/mtb-action-hero.jpg"
      as="image"
      fetchpriority="high"
    />
    <meta
      name="description"
      content="Pastilhas de freio GHENO para MTB no catálogo online. Consulte cubos, aros e rotores com a equipe comercial."
    />
    <meta
      name="keywords"
      content="pastilhas de freio MTB, cubos MTB, aros MTB, rotores freio a disco, componentes mountain bike, GHENO, freio hidráulico MTB"
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/brand/logo-square.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/brand/logo-square.jpg" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="GHENO | Componentes MTB de Alto Desempenho"
    />
    <meta
      property="og:description"
      content="Pastilhas de freio GHENO no catálogo online. Cubos, aros e rotores sob consulta comercial."
    />
    <meta property="og:image" content="/reference-images/mtb-action-hero.jpg" />
    <meta property="og:locale" content="pt_BR" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="GHENO | Componentes MTB de Alto Desempenho"
    />
    <meta
      name="twitter:description"
      content="Pastilhas de freio GHENO no catálogo online. Cubos, aros e rotores sob consulta comercial."
    />
    <meta
      name="twitter:image"
      content="/reference-images/mtb-action-hero.jpg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
